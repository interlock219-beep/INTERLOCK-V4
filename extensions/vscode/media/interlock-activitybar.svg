<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Interlock">
  <title>Interlock</title>
  <!-- Interlock shield (brand mark): electric-yellow shield with two
       interlocking bars cut out of it. No text, so it stays legible at 16px.
       One even-odd path: the bars are transparent holes, which keeps the mark
       readable whether the host renders it as-is or tints it to a single colour.
       The same geometry ships as the webview header mark
       (SHIELD_LOGO_PATH in src/webviewHtml.ts) and as the extension icon
       (media/interlock-icon.png, generated by tools/build-icon.py). -->
  <path fill="#FFE500" stroke="#191919" stroke-width=".8" stroke-linejoin="round"
        fill-rule="evenodd"
        d="M12 2.2 20 5.1v6.4c0 4.6-3.2 8.6-8 10.4-4.8-1.8-8-5.8-8-10.4V5.1L12 2.2ZM7.4 9.6h9.2v2.8H7.4ZM9.4 14h5.2v2.6H9.4Z"/>
</svg>
