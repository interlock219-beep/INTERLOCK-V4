[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlock"
version = "4.0.0"
description = "Enterprise-grade dynamic proof-of-intent authorization gateway for AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pyjwt>=2.9,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=4.5,<5.0",
    "cryptography>=43.0,<51.0",
    "PyYAML>=6.0,<7.0",
    "sqlglot>=25.0,<30.0",
    "pyotp>=2.9,<3.0",
]

# The Terminal Runner (CLI): one of Interlock's two product interfaces. It is a
# thin terminal layer over the same shared recovery engine + orchestration the
# VS Code extension drives (see interlock_cli.py). Installing `intentlock`
# therefore also provides the `interlock` command.
[project.scripts]
interlock = "interlock_cli:console_entry"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "bandit>=1.7,<2.0",
    "pre-commit>=4.0,<5.0",
]
security = [
    "pip-audit>=2.7,<3.0",
    "cyclonedx-bom>=7.0,<8.0",
]
test = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-benchmark>=4.0,<5.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
# The Terminal Runner ships as a single top-level module (alongside the app/sdk
# packages) so the `interlock` console script resolves after install.
py-modules = ["interlock_cli"]

[tool.setuptools.packages.find]
include = ["app*", "sdk*"]

# Ship the migration runtime + config template as data files (installed to
# sys.prefix/share/intentlock) so a built wheel can run migrations without
# colliding with the `alembic` tool's own top-level package. alembic.ini uses
# `script_location = %(here)s/alembic` so this resolves for both a source
# checkout and an installed prefix. The sdist additionally carries these via
# MANIFEST.in so an unpacked sdist is a complete source tree.
[tool.setuptools.data-files]
"share/intentlock" = ["alembic.ini", ".env.example"]
"share/intentlock/alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"share/intentlock/alembic/versions" = ["alembic/versions/*.py"]
# Shared engine command layer for BOTH interfaces (VS Code extension + Terminal
# Runner). Installed so the `interlock` command finds it outside a source
# checkout (interlock_cli.py searches sys.prefix/share/intentlock/python/).
"share/intentlock/python" = ["extensions/vscode/python/interlock_bridge.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
exclude = ["alembic/versions/*.py", "scripts", "examples", ".env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "DTZ", "T20"]
ignore = ["S101", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106", "S105"]
"demo_e2e_control_plane.py" = ["T201"]
"demo_e2e_causal_recovery.py" = ["T201"]
"app/infrastructure/recovery/database_recovery_adapter.py" = ["S608"]
# Terminal Runner + its independent lifecycle drivers. For the CLI, printing IS
# the interface (T201). For both, single-line verbose assertions and readable
# usage strings stay unwrapped (E501 - the codebase itself does not gate line
# length), and the drivers use safe list-form subprocess calls (S603).
"interlock_cli.py" = ["T201", "E501"]
"tests/integration/cli_*.py" = ["T201", "E501", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "^tests/|^scripts/"
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["redis.*", "yaml.*", "jwt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers", "--cov", "--cov-report=term-missing", "--cov-report=xml"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app", "sdk"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests"]

[tool.pip-audit]
strict = true
skip_editable = true
