name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main", "develop"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intentlock_test
          POSTGRES_USER: intentlock
          POSTGRES_PASSWORD: intentlock_test_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "intentlock_redis_test_secret"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"

      - name: Lint with ruff
        # Scoped to app+sdk (verified 0 errors at 145a3d9 + V6 changes).
        # tests/ carries ~600 pre-existing style findings (E501/W293/F401)
        # documented as debt; linting them here would make CI permanently
        # red without a separate cleanup change.
        run: ruff check app sdk

      - name: Type check with mypy
        run: mypy app

      - name: Security scan with bandit
        run: bandit -r app -ll

      - name: Static analysis with semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
          generate-token: true

      - name: Check database migrations
        env:
          DATABASE_URL: postgresql+psycopg2://intentlock:intentlock_test_secret@localhost:5432/intentlock_test
        run: |
          alembic upgrade head
          alembic check
          alembic current

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg2://intentlock:intentlock_test_secret@localhost:5432/intentlock_test
          REDIS_URL: redis://:intentlock_redis_test_secret@localhost:6379/0
          REDIS_ENABLED: "true"
          JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long
          APP_ENV: test
          DEBUG: "true"
        run: |
          pytest --cov=app --cov=sdk --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  recovery-cross-platform:
    # Additive, service-free job for the FILESYSTEM-RECOVERY scope (the
    # declared V6 controlled-beta scope). Verifies clean install, dependency
    # consistency, lint, and the recovery regression subset across the three
    # desktop OSes and every declared Python minor (3.11-3.14).
    # On Linux/macOS runners the two symlink-confinement drills EXECUTE
    # (unprivileged symlink creation works there), converting them from
    # locally-BLOCKED to real POSIX evidence on the first push.
    # Green here does NOT replace real disk-full (M2) or process-kill (M1)
    # failure evidence, nor native-permission (R17) assertions beyond what
    # the POSIX-only tests report when they run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Dependency consistency
        run: python -m pip check

      - name: Lint (CI scope)
        run: ruff check app sdk

      - name: Recovery regression subset
        run: pytest tests/unit/test_filesystem_recovery_adapter.py tests/unit/test_recovery_fault_injection.py tests/unit/test_backup_restore_drill.py -o addopts= -q

      - name: Workspace path security (containment, UNC, junction, non-ASCII)
        # Runs on every OS in this matrix; the junction drill executes where
        # junctions can be created (Windows) and skips elsewhere.
        run: pytest tests/integration/test_workspace_protection -o addopts= -q

  macos-release-artifact:
    # macOS release-artifact job (mission: make macOS available).
    # Builds the real distributable on a genuine macOS runner (Apple
    # Silicon), records SHA-256 hashes, uploads the wheel+sdist as a
    # workflow artifact, installs the built wheel, and runs the macOS-native
    # recovery + permission + symlink tests against the source tree.
    # A green run of THIS job is evidence, not publication: nothing is
    # uploaded to PyPI, GitHub Releases, or any website, and the macOS
    # download button stays disabled until the release gate in
    # docs/operations/SUPPORTED_PLATFORMS.md is fully satisfied with a
    # published destination (requires separate owner authorization).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build wheel + sdist (real macOS build)
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Record artifact SHA-256 hashes
        run: shasum -a 256 dist/*

      - name: Install built wheel + pip check (neutral cwd)
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "import app.infrastructure.recovery.filesystem_recovery_adapter as m; assert 'site-packages' in m.__file__, m.__file__; print('site-packages import OK:', m.__file__)"

      - name: macOS-native recovery + security test subset
        run: |
          python -m pip install -e ".[test]"
          pytest tests/unit/test_filesystem_recovery_adapter.py tests/unit/test_recovery_fault_injection.py tests/unit/test_backup_restore_drill.py tests/unit/test_tool_security.py -o addopts= -q

      - name: Upload macOS artifact (evidence, not publication)
        uses: actions/upload-artifact@v4
        with:
          name: intentlock-macos-build
          path: dist/
          retention-days: 30

  cli-checks:
    # TST-01: the Terminal Runner's lifecycle and clean-install checks are
    # standalone scripts, so nothing ran them automatically. They are the only
    # automated proof that (a) the CLI works without VS Code and (b) the
    # packaged wheel works in a fresh environment.
    name: CLI lifecycle and clean-install checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('tests/integration/cli_lifecycle_check.py') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: CLI lifecycle check (protect -> preview -> recover -> verify)
        run: python tests/integration/cli_lifecycle_check.py

      - name: CLI clean-install check (packaged wheel in a fresh venv)
        run: python tests/integration/cli_clean_install_check.py

      - name: Packaging completeness guard
        # Fails if the packaging configuration references files that are not in
        # the tree (SUPPLY-01): a wheel must never silently ship without the
        # console script or the shared engine command layer.
        run: pytest tests/unit/test_packaging_manifest.py -o addopts= -q

  vscode-extension:
    # TST-02 + PKG-01: the extension is one of the two shipped interfaces and
    # had no CI gate at all, so a broken extension shipped unnoticed. This job
    # type-checks, lints, tests, verifies the vendored engine bundle against
    # the canonical source, and packages the VSIX with its SHA-256.
    name: VS Code extension
    runs-on: ubuntu-latest
    if: ${{ hashFiles('extensions/vscode/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Type check
        working-directory: extensions/vscode
        run: npm run typecheck

      - name: Lint
        working-directory: extensions/vscode
        run: npm run lint

      - name: Unit tests
        working-directory: extensions/vscode
        run: npm run test:unit

      - name: Engine bundle matches the canonical source
        working-directory: extensions/vscode
        run: node tools/build-engine-bundle.js --verify

      - name: Package the extension
        working-directory: extensions/vscode
        run: npm run package

      - name: Record the artifact SHA-256
        working-directory: extensions/vscode
        run: sha256sum interlock-vscode-*.vsix | tee vsix-sha256.txt

      - name: Inspect the package contents
        working-directory: extensions/vscode
        run: |
          unzip -l interlock-vscode-*.vsix | head -40
          unzip -l interlock-vscode-*.vsix | grep -q 'extension/python/interlock_bridge.py' \
            || { echo 'the shared engine command layer is missing from the package'; exit 1; }
          unzip -l interlock-vscode-*.vsix | grep -q 'extension/engine/manifest.json' \
            || { echo 'the engine bundle manifest is missing from the package'; exit 1; }

      - name: Upload the package (evidence, not publication)
        uses: actions/upload-artifact@v4
        with:
          name: interlock-vsix
          path: |
            extensions/vscode/interlock-vscode-*.vsix
            extensions/vscode/vsix-sha256.txt
          retention-days: 30

  website:
    # TST-02: the website is the public face of the product and had no gate.
    name: Website
    runs-on: ubuntu-latest
    if: ${{ hashFiles('site/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Type check
        working-directory: site
        run: npm run typecheck

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Unit tests
        working-directory: site
        run: npm test

      - name: Production build
        working-directory: site
        run: npm run build
